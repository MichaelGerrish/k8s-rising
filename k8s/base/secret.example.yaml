# EXAMPLE ONLY. Do NOT commit real secrets.
#
# Create the real Secret out-of-band (it is referenced via envFrom):
#
#   kubectl -n vrising create secret generic vrising-secrets \
#     --from-literal=HOST_SETTINGS_Password='your-server-password' \
#     --from-literal=HOST_SETTINGS_Rcon__Password='your-rcon-password'
#
# Leave HOST_SETTINGS_Password out entirely for a public (no-password) server.
# Note: with a server password, joining via Steam may not work — use the
# in-game server list / direct connect (see the docker-vrising README).
apiVersion: v1
kind: Secret
metadata:
  name: vrising-secrets
  namespace: vrising
type: Opaque
stringData:
  HOST_SETTINGS_Password: "CHANGE-ME-or-remove-for-public"
  HOST_SETTINGS_Rcon__Password: "CHANGE-ME"
