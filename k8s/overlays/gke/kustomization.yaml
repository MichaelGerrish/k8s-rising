apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vrising

resources:
  - ../../base

patches:
  - path: patches/service-ip.yaml

# Pin the image to an immutable tag for reproducible deploys. Replace `latest`
# with a dated tag (the upstream build publishes trueosiris/vrising:YYYY-MM-DD-HHMM)
# or, better, a digest: trueosiris/vrising@sha256:<digest>.
images:
  - name: trueosiris/vrising
    newTag: latest
